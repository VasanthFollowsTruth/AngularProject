<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Brand -->
    <a class="navbar-brand" routerLink="/" (click)="closeMenu()">
      Contact Manager
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" (click)="toggleMenu()">

      <span class="navbar-toggler-icon"></span>

    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="mainNavbar">

      <!-- Left Links -->
      <ul class="navbar-nav mb-2 mb-lg-0">

        @if (auth.isLoggedIn()) {

        <li class="nav-item">
          <a class="nav-link" routerLink="/contacts" (click)="closeMenu()" routerLinkActive="active">
            Contacts
          </a>
        </li>

        }

      </ul>

      <!-- Right Button -->
      <div class="ms-auto">

        @if (auth.isLoggedIn()) {

        <button class="btn btn-danger btn-sm px-3" (click)="logout()">

          Logout

        </button>

        } @else {

        <a class="btn btn-outline-light btn-sm px-3" routerLink="/login" (click)="closeMenu()"
          routerLinkActive="active">

          Login

        </a>

        }

      </div>

    </div>
  </div>
</nav>
