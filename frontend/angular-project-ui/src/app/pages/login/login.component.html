<div class="row justify-content-center">

  <div class="col-md-4">

    <h3 class="mb-3 text-center">Login</h3>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form (ngSubmit)="login()">

      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="model.email"
          name="email"
          required>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="model.password"
          name="password"
          required>
      </div>

      <button
        class="btn btn-primary w-100"
        type="submit">
        Login
      </button>

    </form>

  </div>

</div>
