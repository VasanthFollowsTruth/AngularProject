<form (ngSubmit)="onSubmit()">

  <div class="row">

    <div class="col-md-6 mb-3">
      <label>First Name</label>
      <input
        class="form-control"
        [(ngModel)]="contact.firstName"
        name="firstName"
        required>
    </div>

    <div class="col-md-6 mb-3">
      <label>Last Name</label>
      <input
        class="form-control"
        [(ngModel)]="contact.lastName"
        name="lastName"
        required>
    </div>

    <div class="col-md-6 mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="contact.email"
        name="email"
        required>
    </div>

    <div class="col-md-6 mb-3">
      <label>Phone</label>
      <input
        class="form-control"
        [(ngModel)]="contact.phoneNumber"
        name="phoneNumber"
        required>
    </div>

    <div class="col-md-12 mb-3">
      <label>Address</label>
      <input
        class="form-control"
        [(ngModel)]="contact.address"
        name="address"
        required>
    </div>

    <div class="col-md-4 mb-3">
      <label>City</label>
      <input
        class="form-control"
        [(ngModel)]="contact.city"
        name="city"
        required>
    </div>

    <div class="col-md-4 mb-3">
      <label>State</label>
      <input
        class="form-control"
        [(ngModel)]="contact.state"
        name="state"
        required>
    </div>

    <div class="col-md-4 mb-3">
      <label>Country</label>
      <input
        class="form-control"
        [(ngModel)]="contact.country"
        name="country"
        required>
    </div>

    <div class="col-md-4 mb-3">
      <label>Postal Code</label>
      <input
        class="form-control"
        [(ngModel)]="contact.postalCode"
        name="postalCode"
        required>
    </div>

  </div>

  <div class="text-end mt-3">

    <button
      type="button"
      class="btn btn-secondary me-2"
      (click)="onCancel()">

      Cancel
    </button>

    <button
      type="submit"
      class="btn btn-primary">

      {{ isEdit ? 'Update' : 'Create' }}

    </button>

  </div>

</form>
